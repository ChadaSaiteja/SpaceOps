name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Package Release Asset
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Rust FFI native release binary
        run: |
          cd storage-intelligence/core
          cargo build --release -p ffi

      - name: Publish WinUI 3 Desktop Application
        run: |
          dotnet publish storage-intelligence/app/StorageIntelligence/StorageIntelligence.csproj -c Release -r win-x64 --self-contained false -o ./publish

      - name: Copy native DLL to publish directory
        run: |
          Copy-Item "storage-intelligence/core/target/release/ffi.dll" -Destination "./publish/ffi.dll" -Force

      - name: Create Release Zip
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./SpaceOps-win-x64.zip

      - name: Generate SHA-256 Checksum
        run: |
          $hash = (Get-FileHash ./SpaceOps-win-x64.zip -Algorithm SHA256).Hash
          "$hash  SpaceOps-win-x64.zip" | Out-File -FilePath ./SpaceOps-win-x64.zip.sha256 -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./SpaceOps-win-x64.zip
            ./SpaceOps-win-x64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

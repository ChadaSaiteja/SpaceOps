ShortDescription: Free, open-source disk analyzer and storage cleaner for Windows with a treemap and Recycle Bin-safe cleanup.
Description: SpaceOps scans drives with a parallel Rust engine, shows disk usage as an interactive Direct2D treemap, detects developer clutter (node_modules, Rust target, .NET bin/obj, Python venvs, WSL and Docker virtual disks) and routes every cleanup through the Windows Recycle Bin. Runs fully offline.

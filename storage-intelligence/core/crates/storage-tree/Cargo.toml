[package]
name = "storage-tree"
version = "0.1.0"
edition.workspace = true

[dependencies]
common = { path = "../common" }
scanner = { path = "../scanner" }
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Registry",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"

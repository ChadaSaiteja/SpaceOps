name: CI

# The Windows build runs only when app code changes, only once, and only tests what changed:
# - Website/docs-only changes (index.html, *.md, docs/, docs-site/, images...) skip the build.
# - C# app/test changes: build + C# tests; Rust format, lint and tests are skipped.
# - Rust core changes: Rust format, lint and tests + C# tests (the app calls the core, and the
#   C# integration tests are what catch a core change that breaks the app).
# - A PR merged into main is not rebuilt; it already passed on the PR.
# - A new push to the same PR cancels the run that is still in progress.
# - "Run workflow" on the Actions tab always runs the full build.
# Use the "CI result" check (not "Build & Test") as the required status check: it passes
# when the build passed or was correctly skipped.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the build is needed
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # decide <build needed> <rust checks needed> <reason>
          decide() {
            echo "code=$1" >> "$GITHUB_OUTPUT"; echo "rust=$2" >> "$GITHUB_OUTPUT"
            echo "Build needed: $1, Rust checks: $2 ($3)"
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then decide true true "manual run"; exit 0; fi

          if [ "$EVENT" = "push" ]; then
            # Merges from a PR were already built and tested on the PR.
            first_line="$(printf '%s' "$HEAD_MESSAGE" | head -n1)"
            if printf '%s' "$first_line" | grep -qE '^Merge pull request #[0-9]+|\(#[0-9]+\)$'; then
              decide false false "PR merge, already tested on the PR"; exit 0
            fi
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          else
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            decide true true "no usable base commit"; exit 0
          fi

          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"; echo "$changed"
          # Build config or this workflow changed: run everything.
          if echo "$changed" | grep -qE '^(global\.json|\.github/workflows/ci\.yml)$'; then
            decide true true "build config or CI workflow changed"; exit 0
          fi
          rust=false; app=false
          echo "$changed" | grep -qE '^storage-intelligence/core/' && rust=true
          echo "$changed" | grep -qE '^storage-intelligence/(app|tests|scripts)/' && app=true
          if [ "$rust" = true ]; then
            decide true true "Rust core changed"
          elif [ "$app" = true ]; then
            decide true false "only the C# app/tests changed"
          else
            decide false false "only website/docs changed"
          fi

  build-and-test:
    name: Build & Test (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # A normal run takes ~5-10 min; never let a stuck test hold a runner for hours.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: storage-intelligence/core

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: NuGet package cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'storage-intelligence/app/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify Rust code formatting
        if: needs.changes.outputs.rust == 'true'
        run: |
          cd storage-intelligence/core
          cargo fmt --all -- --check

      - name: Run Rust Clippy linter
        if: needs.changes.outputs.rust == 'true'
        run: |
          cd storage-intelligence/core
          cargo clippy --all-targets -- -D warnings

      - name: Run Rust workspace tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          cd storage-intelligence/core
          cargo test --workspace --verbose

      - name: Build Rust FFI native release binary
        run: |
          cd storage-intelligence/core
          cargo build --release -p ffi

      - name: Build WinUI 3 Desktop Application
        run: |
          dotnet build storage-intelligence/app/StorageIntelligence/StorageIntelligence.csproj -c Release

      # Non-blocking: start the real app for ~8 s and report whether it stayed up and whether it
      # wrote crash.log next to the exe. Never deletes anything; a pre-existing crash.log is only
      # counted if it was rewritten during this launch.
      - name: Launch check (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem storage-intelligence/app/StorageIntelligence/bin/Release -Recurse -Filter StorageIntelligence.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "StorageIntelligence.exe not found"; exit 1 }
          $crashLog = Join-Path $exe.DirectoryName 'crash.log'
          $before = if (Test-Path $crashLog) { (Get-Item $crashLog).LastWriteTimeUtc } else { $null }
          Write-Host "Launching $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          $alive = -not $p.HasExited
          $crashed = (Test-Path $crashLog) -and (($null -eq $before) -or ((Get-Item $crashLog).LastWriteTimeUtc -gt $before))
          Write-Host "Alive after 8s: $alive"
          if (-not $alive) { Write-Host "Exit code: $($p.ExitCode)" }
          Write-Host "crash.log written: $crashed"
          if ($crashed) { Get-Content $crashLog | Select-Object -First 40 }
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $alive -or $crashed) { exit 1 }

      # Runs every test except those that read this machine's installed apps and global caches
      # (Category=Machine: a CI runner's software says nothing about our code). Includes SmokeTests
      # (end-to-end scan -> tree -> treemap -> search -> developer storage -> dry-run-only cleanup).
      # --blame-hang kills any test stuck for 3 minutes and records which one it was; test classes
      # run one at a time here so the test it names is the one that was actually stuck.
      - name: Run C# integration tests (FFI boundary + end-to-end smoke)
        timeout-minutes: 15
        env:
          SI_TEST_TRACE: ${{ runner.temp }}/test-trace.log
        run: >
          dotnet test storage-intelligence/tests/integration/StorageIntelligence.IntegrationTests.csproj
          -c Release
          --filter "Category!=Machine"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
          --blame-hang --blame-hang-timeout 3m
          -- xUnit.ParallelizeTestCollections=false

      # Turns failed or hung tests into annotations on the run summary, readable without opening logs.
      - name: Report failed or hung tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            foreach ($r in $x.TestRun.Results.UnitTestResult) {
              if ($r.outcome -ne 'Passed') { Write-Host "::error title=Test $($r.outcome)::$($r.testName)" }
            }
          }
          $trace = Join-Path $env:RUNNER_TEMP 'test-trace.log'
          if (Test-Path $trace) {
            foreach ($line in Get-Content $trace | Select-Object -Last 20) { Write-Host "::warning title=Test trace::$line" }
          }
          foreach ($seq in Get-ChildItem TestResults -Recurse -Filter Sequence_*.xml -ErrorAction SilentlyContinue) {
            [xml]$q = Get-Content $seq.FullName
            $last = @($q.TestSequence.Test) | Select-Object -Last 1
            if ($last) { Write-Host "::error title=Test running when the host hung or crashed::$($last.Name)" }
          }

  ci-result:
    name: CI result
    if: always()
    needs: [ changes, build-and-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Report overall result
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build-and-test.result }}
          NEEDED: ${{ needs.changes.outputs.code }}
        run: |
          echo "Detect changes: $CHANGES, build needed: $NEEDED, build: $BUILD"
          if [ "$CHANGES" != "success" ]; then echo "Change detection failed"; exit 1; fi
          if [ "$BUILD" = "success" ] || { [ "$BUILD" = "skipped" ] && [ "$NEEDED" != "true" ]; }; then
            echo "CI passed"; exit 0
          fi
          echo "Build & Test did not pass"; exit 1

name: Deploy Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'codemeta.json'
      - 'site.webmanifest'
      - 'og-image.png'
      - 'favicon.*'
      - 'apple-touch-icon.png'
      - 'icon-*.png'
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site output
        run: |
          mkdir -p _site
          cp index.html sitemap.xml robots.txt llms.txt llms-full.txt codemeta.json site.webmanifest _site/
          cp og-image.png apple-touch-icon.png icon-192.png icon-512.png _site/
          cp favicon.ico favicon.svg favicon-16.png favicon-32.png _site/
          cp -r docs-site _site/docs-site
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
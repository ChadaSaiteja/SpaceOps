<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage App — UI Style Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0a0c10;color:#e8ecf4;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}

/* ---------- Lab chrome ---------- */
.lab{flex-shrink:0;background:#0f1319;border-bottom:1px solid #1d2430;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lab h1{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.lab h1 span{color:#8b98ad;font-weight:500}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vtab{background:#151b25;border:1px solid #232c3a;color:#9aa7bd;font:600 12px 'Inter';padding:7px 13px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center}
.vtab b{font-family:'JetBrains Mono';font-size:11px;color:#5d6b82}
.vtab:hover{color:#fff;border-color:#3a4658}
.vtab.on{background:#e8ecf4;color:#0a0c10;border-color:#e8ecf4}.vtab.on b{color:#0a0c10;opacity:.55}
.vdesc{flex-basis:100%;font-size:12px;color:#8b98ad;line-height:1.5}
.vdesc strong{color:#e8ecf4}
.stage{flex:1;min-height:0;padding:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#141a24,#0a0c10 70%)}

/* ---------- App window (shared structure) ---------- */
.app{width:min(1280px,100%);height:100%;max-height:760px;display:flex;flex-direction:column;overflow:hidden;position:relative;
  background:var(--bg);color:var(--text);font-family:var(--font);border:1px solid var(--border);border-radius:var(--win-r);box-shadow:0 40px 100px -30px rgba(0,0,0,.7);font-size:13px}
.titlebar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--title);border-bottom:1px solid var(--border);font-size:12px;color:var(--sub)}
.titlebar .ti{width:16px;height:16px}
.titlebar .wc{margin-left:auto;display:flex;gap:18px;font-size:11px;color:var(--sub);letter-spacing:.2em}
.body{flex:1;min-height:0;display:flex;position:relative}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--hdr)}
.pathbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--border);border-radius:var(--r-s);padding:8px 12px;color:var(--sub);font-family:var(--mono);font-size:12px;min-width:0}
.pathbox svg{width:15px;height:15px;color:var(--accent);flex-shrink:0}
.pathbox span{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--font);padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:var(--btn-glow)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{border-color:color-mix(in srgb,var(--amber) 50%,var(--border));color:var(--amber)}
.btn svg{width:14px;height:14px}
.page{flex:1;min-height:0;overflow:auto;padding:18px}
.status{flex-shrink:0;height:34px;display:flex;align-items:center;gap:14px;padding:0 18px;border-top:1px solid var(--border);background:var(--hdr);font-size:11.5px;color:var(--sub)}
.status .sp{flex:1}
.prog{width:140px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;opacity:0;transition:opacity .2s}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.prog.run{opacity:1}.prog.run i{animation:scan 1.6s ease-out forwards}
@keyframes scan{to{width:100%}}

/* nav */
.nav{display:flex;gap:2px;flex-shrink:0}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--sub);font:500 13px var(--font);cursor:pointer;border-radius:var(--r-s);position:relative;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex-shrink:0}
.nav button:hover{color:var(--text);background:var(--nav-hover)}
.nav button.on{color:var(--text);background:var(--nav-on);font-weight:600}
.nav button.on svg{color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}

/* cards & generic */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--card-sh)}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--sub);font-weight:600;margin-bottom:12px;font-family:var(--font)}
.grid{display:grid;gap:14px}
.mono{font-family:var(--mono)}
.sub{color:var(--sub)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--accent);line-height:1.1}
.pill{display:inline-block;font:600 10px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid transparent}
.p-low{background:rgba(52,211,153,.14);color:var(--green);border-color:rgba(52,211,153,.3)}
.p-med{background:rgba(251,191,36,.14);color:var(--amber);border-color:rgba(251,191,36,.32)}
.p-high{background:rgba(251,113,133,.14);color:var(--red);border-color:rgba(251,113,133,.32)}
.p-dorm{background:rgba(251,191,36,.14);color:var(--amber);border-color:rgba(251,191,36,.32)}
.p-act{background:rgba(52,211,153,.14);color:var(--green);border-color:rgba(52,211,153,.3)}
.p-neu{background:var(--nav-on);color:var(--sub);border-color:var(--border)}
.bar{height:7px;border-radius:4px;background:var(--border);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-s);margin-bottom:8px;box-shadow:var(--card-sh)}
.row:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .d{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d.m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.row .sz{text-align:right;font:700 14px var(--mono);color:var(--accent)}
.row .sz small{display:block;font:500 10.5px var(--font);color:var(--sub);margin-top:1px}
.ico{width:34px;height:34px;border-radius:var(--r-s);display:grid;place-items:center;color:#fff;flex-shrink:0}
.ico svg{width:17px;height:17px}
.ck{width:18px;height:18px;border:1.6px solid var(--accent);border-radius:5px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;background:transparent}
.ck.on{background:var(--accent)}
.ck.on::after{content:"";width:4px;height:8px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sw{width:34px;height:19px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:.15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:17px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:600 11.5px var(--font);padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h p{font-size:12px;color:var(--sub);margin-top:2px}

/* treemap */
.tm-wrap{display:grid;grid-template-columns:1fr 290px;gap:14px;height:100%}
.tm-left{display:flex;flex-direction:column;min-width:0;min-height:0}
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:10px;font:500 12px var(--mono);color:var(--sub);flex-wrap:wrap}
.crumbs b{color:var(--text);font-weight:500}
.crumbs .srch{margin-left:auto;background:var(--field);border:1px solid var(--border);border-radius:var(--r-s);padding:6px 12px;font-size:11.5px;min-width:200px;color:var(--muted)}
.tm{flex:1;min-height:260px;position:relative;border-radius:var(--r);overflow:hidden;background:var(--tm-bg);border:1px solid var(--border)}
.tile{position:absolute;overflow:hidden;padding:9px 10px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:filter .12s,transform .12s;border-radius:var(--tile-r);border:var(--tile-b)}
.tile .n{font:600 12px var(--font);text-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .z{font:500 10.5px var(--mono);opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tile:hover{filter:brightness(1.15);z-index:3}
.tile.sel{outline:2px solid #fff;outline-offset:-2px;z-index:4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.det .path{font:500 11.5px var(--mono);word-break:break-all;margin:8px 0 14px;color:var(--text)}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px;color:var(--sub);margin-top:12px}
.det dd{text-align:right;color:var(--text);font-family:var(--mono)}

/* overview */
.ov{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}
.ov .span2{grid-column:span 2}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--card)}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center;font:700 22px var(--mono)}
.donut-c small{display:block;font:500 10px var(--font);color:var(--sub)}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border:0}
.kv b{font-family:var(--mono);font-weight:600}

/* ============ VARIANT 1 — Fluent Sidebar (dark teal) ============ */
.app[data-v="1"]{--bg:#0b0f17;--title:#0d121b;--hdr:#0d121b;--card:#111724;--field:#0a0e16;--border:#1f2a3c;--text:#f0f4fc;--sub:#8b9bb4;--muted:#56657e;
 --accent:#00f5d4;--accent2:#3a86ff;--on-accent:#052e25;--green:#34d399;--amber:#fbbf24;--red:#fb7185;--nav-hover:#141c2a;--nav-on:#182234;
 --font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--r:12px;--r-s:8px;--win-r:12px;--card-sh:none;--btn-glow:0 4px 18px -6px rgba(0,245,212,.5);--tm-bg:#080b12;--tile-r:6px;--tile-b:1px solid rgba(255,255,255,.1)}
.app[data-v="1"] .side{width:210px;flex-shrink:0;border-right:1px solid var(--border);background:#0d121b;padding:16px 12px;display:flex;flex-direction:column;gap:18px}
.app[data-v="1"] .nav{flex-direction:column}.app[data-v="1"] .nav button{padding:10px 12px}
.app[data-v="1"] .nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.app[data-v="1"] .tile{background-image:linear-gradient(135deg,rgba(255,255,255,.14),rgba(0,0,0,.18))}

/* ============ VARIANT 2 — Command Center (top tabs, dense, neon) ============ */
.app[data-v="2"]{--bg:#05070a;--title:#080b10;--hdr:#080b10;--card:#0a0e14;--field:#05070a;--border:#182030;--text:#d6e4f0;--sub:#6f86a0;--muted:#455870;
 --accent:#39ff88;--accent2:#00c8ff;--on-accent:#02170b;--green:#39ff88;--amber:#ffb020;--red:#ff4466;--nav-hover:#0e1520;--nav-on:#0e1a1a;
 --font:'JetBrains Mono',monospace;--mono:'JetBrains Mono',monospace;--r:2px;--r-s:2px;--win-r:4px;--card-sh:none;--btn-glow:0 0 14px -2px rgba(57,255,136,.55);--tm-bg:#05070a;--tile-r:0;--tile-b:1px solid #05070a}
.app[data-v="2"] .topnav{display:flex;align-items:center;gap:22px;padding:0 16px;border-bottom:1px solid var(--border);background:#080b10;height:44px;flex-shrink:0}
.app[data-v="2"] .nav button{padding:13px 12px;border-radius:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.app[data-v="2"] .nav button.on{background:none;border-bottom:2px solid var(--accent);color:var(--accent)}
.app[data-v="2"] .nav button svg{display:none}
.app[data-v="2"] .brand{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.app[data-v="2"] .card h3{color:var(--accent);letter-spacing:.14em}
.app[data-v="2"] .tile{border:1px solid #05070a;opacity:.94}
.app[data-v="2"] .tile .n{text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
.app[data-v="2"] .big{text-shadow:0 0 18px rgba(57,255,136,.45)}
.app[data-v="2"] .page{background-image:linear-gradient(rgba(57,255,136,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,136,.025) 1px,transparent 1px);background-size:28px 28px}

/* ============ VARIANT 3 — Clean Light (Windows 11 native feel, icon rail) ============ */
.app[data-v="3"]{--bg:#f3f4f7;--title:#eceef3;--hdr:#fafbfc;--card:#ffffff;--field:#f3f4f7;--border:#e1e4ea;--text:#1a1d24;--sub:#5f6877;--muted:#8d95a3;
 --accent:#0f6cbd;--accent2:#6b4fd8;--on-accent:#fff;--green:#107c41;--amber:#b25e09;--red:#c42b3b;--nav-hover:#e8ebf1;--nav-on:#dfe6f3;
 --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--r:8px;--r-s:5px;--win-r:8px;--card-sh:0 1px 2px rgba(20,30,60,.06);--btn-glow:none;--tm-bg:#e9ecf2;--tile-r:4px;--tile-b:2px solid #f3f4f7}
.app[data-v="3"] .rail{width:62px;flex-shrink:0;background:#eceef3;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:14px}
.app[data-v="3"] .nav{flex-direction:column;gap:6px}
.app[data-v="3"] .nav button{width:44px;height:44px;justify-content:center;padding:0;font-size:0;gap:0}
.app[data-v="3"] .nav button.on::before{content:"";position:absolute;left:-9px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent)}
.app[data-v="3"] .pill{font-weight:600}
.app[data-v="3"] .p-low,.app[data-v="3"] .p-act{background:#dff3e6;border-color:#bfe3cc}
.app[data-v="3"] .p-med,.app[data-v="3"] .p-dorm{background:#fdf0d8;border-color:#f3dba7}
.app[data-v="3"] .p-high{background:#fbe1e4;border-color:#f1bcc3}
.app[data-v="3"] .tile .n,.app[data-v="3"] .tile .z{text-shadow:none}
.app[data-v="3"] .titlebar .wc{color:#444}

/* ============ VARIANT 4 — Zen Dock (treemap-first, floating dock) ============ */
.app[data-v="4"]{--bg:#0e0e12;--title:#0e0e12;--hdr:transparent;--card:#16161c;--field:#16161c;--border:#25252e;--text:#f3f1ee;--sub:#9d9aa6;--muted:#66636e;
 --accent:#ff9b54;--accent2:#ff5e8a;--on-accent:#2a1204;--green:#7ddf9b;--amber:#ffc46b;--red:#ff7a8d;--nav-hover:#202028;--nav-on:#2a2a35;
 --font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--r:18px;--r-s:12px;--win-r:18px;--card-sh:none;--btn-glow:0 6px 24px -8px rgba(255,155,84,.6);--tm-bg:#0e0e12;--tile-r:14px;--tile-b:0}
.app[data-v="4"] .hdr{border:0;padding:14px 22px}
.app[data-v="4"] .status{border:0;background:transparent;padding-bottom:68px}
.app[data-v="4"] .page{padding:6px 22px 0}
.app[data-v="4"] .dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(30,30,38,.82);backdrop-filter:blur(16px);border:1px solid #33333f;border-radius:20px;padding:7px;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);z-index:10}
.app[data-v="4"] .nav button{flex-direction:column;gap:4px;padding:9px 18px;font-size:11px;border-radius:14px}
.app[data-v="4"] .tile{border-radius:16px;background-image:linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.2))}
.app[data-v="4"] .tm{border:0;background:transparent}
.app[data-v="4"] .tm-wrap{grid-template-columns:1fr 250px}
.app[data-v="4"] .brand{font-size:18px}

/* ============ VARIANT 5 — Aurora Glass (gradient, glassmorphism) ============ */
.app[data-v="5"]{--bg:#0b0a1a;--title:rgba(255,255,255,.03);--hdr:rgba(255,255,255,.03);--card:rgba(255,255,255,.055);--field:rgba(255,255,255,.06);--border:rgba(255,255,255,.1);--text:#f5f3ff;--sub:#b3aed6;--muted:#7c78a0;
 --accent:#a78bfa;--accent2:#22d3ee;--on-accent:#150b3a;--green:#6ee7b7;--amber:#fcd34d;--red:#fda4af;--nav-hover:rgba(255,255,255,.06);--nav-on:rgba(167,139,250,.2);
 --font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--r:20px;--r-s:12px;--win-r:20px;--card-sh:0 8px 30px -12px rgba(0,0,0,.5);--btn-glow:0 6px 26px -6px rgba(167,139,250,.65);--tm-bg:transparent;--tile-r:18px;--tile-b:1px solid rgba(255,255,255,.22);
 background:radial-gradient(circle at 12% 8%,rgba(167,139,250,.34),transparent 45%),radial-gradient(circle at 92% 18%,rgba(34,211,238,.24),transparent 42%),radial-gradient(circle at 60% 100%,rgba(244,114,182,.22),transparent 48%),#0b0a1a}
.app[data-v="5"] .side{width:220px;flex-shrink:0;border-right:1px solid var(--border);background:rgba(255,255,255,.03);backdrop-filter:blur(18px);padding:16px 12px;display:flex;flex-direction:column;gap:18px}
.app[data-v="5"] .nav{flex-direction:column}.app[data-v="5"] .nav button{padding:11px 13px;border-radius:14px}
.app[data-v="5"] .card,.app[data-v="5"] .row{backdrop-filter:blur(14px)}
.app[data-v="5"] .tile{backdrop-filter:blur(6px);background-image:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.app[data-v="5"] .tm{border:0}
.app[data-v="5"] .big{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.app[data-v="5"] .btn.pri{background:linear-gradient(90deg,#a78bfa,#22d3ee)}

@media(max-width:900px){.ov{grid-template-columns:1fr}.ov .span2{grid-column:auto}.tm-wrap{display:flex;flex-direction:column;height:auto}.tm-left{height:440px;flex-shrink:0}.app[data-v="1"] .side,.app[data-v="5"] .side{width:170px}}
</style>
</head>
<body>

<div class="lab">
  <h1>Storage App &mdash; <span>UI style variations</span></h1>
  <div class="vtabs" id="vtabs"></div>
  <div class="vdesc" id="vdesc"></div>
</div>
<div class="stage"><div class="app" id="app"></div></div>

<script>
/* ---------- Icons ---------- */
var I={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 map:'<rect x="3" y="3" width="10" height="10" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="11" width="6" height="10" rx="1.5"/><rect x="3" y="15" width="10" height="6" rx="1.5"/>',

/* ---------- Squarified treemap ---------- */
function squarify(items,x,y,w,h){
  var out=[],list=items.slice().sort(function(a,b){return b.s-a.s}),tot=list.reduce(function(a,b){return a+b.s},0);
  var scale=(w*h)/tot,rects=[];
  function worst(row,side){var s=0,mx=0,mn=1e12;row.forEach(function(r){var a=r.s*scale;s+=a;mx=Math.max(mx,a);mn=Math.min(mn,a)});return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))}
  function layout(row,x,y,w,h){
    var s=row.reduce(function(a,r){return a+r.s*scale},0),pos;
    if(w>=h){var cw=s/h;pos=y;row.forEach(function(r){var rh=r.s*scale/cw;out.push({it:r,x:x,y:pos,w:cw,h:rh});pos+=rh});return [x+cw,y,w-cw,h]}
    var ch=s/w;pos=x;row.forEach(function(r){var rw=r.s*scale/ch;out.push({it:r,x:pos,y:y,w:rw,h:ch});pos+=rw});return [x,y+ch,w,h-ch]
  }
  var row=[],rem=[x,y,w,h];
  while(list.length){
    var it=list[0],side=Math.min(rem[2],rem[3]);
    if(!row.length||worst(row.concat([it]),side)<=worst(row,side)){row.push(it);list.shift()}
    else{rem=layout(row,rem[0],rem[1],rem[2],rem[3]);row=[]}
  }
  if(row.length)layout(row,rem[0],rem[1],rem[2],rem[3]);
  return out;
}
function drawTreemap(){

  var pad=gap,rs=squarify(TREE,pad,pad,w-pad*2,h-pad*2),html='';
  rs.forEach(function(r){
    var i=TREE.indexOf(r.it),col=V().cat[r.it.c],big=r.w>70&&r.h>38;
    html+='<div class="tile'+(i===state.sel?' sel':'')+'" data-i="'+i+'" style="left:'+(r.x+gap/2)+'px;top:'+(r.y+gap/2)+'px;width:'+Math.max(0,r.w-gap)+'px;height:'+Math.max(0,r.h-gap)+'px;background-color:'+col+'">'+
      (r.w>46&&r.h>22?'<div class="n">'+r.it.n+'</div>':'')+(big?'<div class="z">'+gb(r.it.s)+'</div>':'')+'</div>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('mouseenter',function(){setSel(+t.dataset.i,true)});
    t.addEventListener('click',function(){setSel(+t.dataset.i,true)});
  });
}

function statusBar(){return '<div class="status"><div class="prog" id="prog"><i></i></div><span id="stx">Ready</span><span class="sp"></span><span class="mono">1,204,331 files &middot; '+gb(TOTAL)+' used &middot; scan 4.2 s</span></div>'}
function render(){
  var v=state.v,app=document.getElementById('app');app.setAttribute('data-v',v);
  var titlebar='<div class="titlebar"><svg class="ti" viewBox="0 0 100 100">'+LOGO.slice(LOGO.indexOf('>')+1,-6)+'</svg>Storage App<span class="wc"><span>&#8211;</span><span>&#9633;</span><span>&#10005;</span></span></div>';
  var brand='<div class="brand">'+LOGO+'<span>Storage App</span></div>';
  var page='<div class="page" id="page">'+PAGES[state.page]()+'</div>';
  var html=titlebar;
  if(v===1||v===5){html+='<div class="body"><div class="side">'+brand+navHtml()+'<div style="margin-top:auto" class="card"><h3 style="margin-bottom:8px">C: drive</h3><div class="bar"><i style="width:'+Math.round(TOTAL/512*100)+'%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></i></div><div class="sub" style="font-size:11px;margin-top:8px">'+gb(TOTAL)+' of 512 GB used</div></div></div><div class="main">'+header()+page+statusBar()+'</div></div>'}
  else if(v===2){html+='<div class="topnav">'+brand+navHtml()+'<span style="margin-left:auto;font-size:11px;color:var(--sub)">C:\\ &middot; '+gb(TOTAL)+'/512 GB</span></div><div class="body"><div class="main">'+header()+page+statusBar()+'</div></div>'}
  else if(v===3){html+='<div class="body"><div class="rail"><div style="width:28px;height:28px">'+LOGO+'</div>'+navHtml()+'</div><div class="main">'+header()+page+statusBar()+'</div></div>'}
  else{html+='<div class="body"><div class="main"><div class="hdr"><div class="brand">'+LOGO+'<span>Storage App</span></div><div class="pathbox" style="margin-left:16px">'+ic('drive')+'<span>C:\\</span></div><button class="btn pri" onclick="scan()">'+ic('play')+'Scan</button></div>'+page+statusBar()+'</div><div class="dock">'+navHtml()+'</div></div>'}
  app.innerHTML=html;
  if(state.page==='treemap')requestAnimationFrame(drawTreemap);
}
function go(p){state.page=p;render();var pg=document.getElementById('page');if(pg)pg.scrollTop=0}
function cl(i){state.cleanOn[i]=!state.cleanOn[i];render()}
function tog(k){state[k]=!state[k];render()}
function eco(e){if(e!=='x')state.eco=e;render()}
function rerun(){var s=document.getElementById('stx');if(s)s.textContent='Re-analyzing…';setTimeout(function(){var s=document.getElementById('stx');if(s)s.textContent='Ready'},900)}
function scan(){var p=document.getElementById('prog'),s=document.getElementById('stx');if(!p)return;p.classList.remove('run');void p.offsetWidth;p.classList.add('run');s.textContent='Scanning C:\\ …';setTimeout(function(){s.textContent='Scan complete';p.classList.remove('run')},1700)}

/* ---------- Lab ---------- */
function labTabs(){
  document.getElementById('vtabs').innerHTML=VARS.map(function(v){return '<button class="vtab'+(state.v===v.id?' on':'')+'" onclick="pick('+v.id+')"><b>'+v.id+'</b>'+v.name+(v.tag?'<b>· '+v.tag+'</b>':'')+'</button>'}).join('');
  document.getElementById('vdesc').innerHTML=V().desc+' &nbsp;<span style="color:#5d6b82">Click through every tab inside the window &mdash; each style implements all five screens.</span>';
}
function pick(id){state.v=id;labTabs();render()}
window.addEventListener('resize',function(){if(state.page==='treemap')drawTreemap()});
window.addEventListener('keydown',function(e){var n=+e.key;if(n>=1&&n<=5)pick(n)});
labTabs();render();
</script>
</body>
</html>

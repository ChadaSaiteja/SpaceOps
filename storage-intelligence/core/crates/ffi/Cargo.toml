[package]
name = "ffi"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
common = { path = "../common" }
scanner = { path = "../scanner" }
storage-tree = { path = "../storage-tree" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
csbindgen = "1"

[dev-dependencies]
tempfile = "3"
